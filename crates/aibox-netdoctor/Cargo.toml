[package]
name = "aibox-netdoctor"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "AiBOX Network Doctor: D0-D4 diagnostics + DiagReport, injectable transports, offline-testable (usable without Tauri)"

[dependencies]
aibox-net = { path = "../aibox-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 注册表读取仅 Windows 需要；Linux CI 不编译该依赖（无系统 C 库，winreg 纯 Rust）
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
