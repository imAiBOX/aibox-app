[package]
name = "aibox-net"
version = "0.1.20"
edition = "2021"
license = "MIT"
description = "AiBOX network layer: channels, DoH resolver, head probe (usable without Tauri)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls 系 TLS（无 native-tls / 无系统 C 库依赖）；sync API，测试不依赖 tokio 运行时
# socks-proxy：支持 socks4/4a/5 代理（用户常配的本地代理就是 socks5）
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"] }
# 纯 Rust SHA-256（S1 全通道哈希零豁免；无系统 C 库，已在 lock 中随依赖链存在）
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
