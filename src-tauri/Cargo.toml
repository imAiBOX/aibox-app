[package]
name = "aibox-app"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "AiBOX portable installer shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aibox-net = { path = "../crates/aibox-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 可执行文件名 = AiBOX.exe（Release 资产按版本号重命名的源文件）
[[bin]]
name = "AiBOX"
path = "src/main.rs"
