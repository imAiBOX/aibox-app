name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 常规：Linux 跑 Rust 原语单测 + 前端 typecheck/build ──
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: i18n key parity (en ↔ zh-CN ↔ zh-TW)
        run: node scripts/check-i18n.mjs

      - name: i18n t() reference audit
        run: node scripts/check-tkeys.mjs

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Frontend typecheck + build
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # net / netdoctor / core 全部可脱离 Tauri 单测（不跑 --workspace：
      # src-tauri 壳在 Linux 需要 gtk/webkit 系统库，由 tauri-check job 负责）
      - name: Rust primitive tests (offline)
        run: cargo test -p aibox-net -p aibox-netdoctor -p aibox-core

  # ── 壳（src-tauri）Rust 编译检查：Linux + GTK/WebKit 系统库（tauri v2 官方依赖表）──
  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev

      # cargo check = debug → tauri-codegen 走 devUrl 分支；dist 兜底建一个空目录
      - name: Check shell crate (Linux)
        run: |
          mkdir -p dist
          cargo check -p aibox-app

  # ── 壳的 cfg(windows) 分支（winreg/windows-sys/netstat 路径）必须也被编译验证 ──
  tauri-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Check shell crate (Windows)
        shell: bash
        run: |
          mkdir -p dist
          cargo check -p aibox-app
          cargo test -p aibox-core manage_paths::tests
          cargo test -p aibox-app maintenance_pause_tests

  # ── Stage the Windows artifact; only the final job may publish. ──
  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # 版本号随 tag 注入：tauri.conf.json + package.json + Cargo.toml
      # （update_check 比较的是 CARGO_PKG_VERSION，三处不同步 → 黄条永远弹）
      # 版本非法（非 x.y.z）→ 脚本 exit 1 → job fail
      - name: Inject version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.mjs "$VERSION"

      # 目录快照：发布二进制内嵌最新 registry index（失败沿用仓库内快照，不阻断）
      - name: Refresh registry catalog snapshot
        run: node scripts/gen-registry-snapshot.mjs

      # --no-bundle：只要 exe（Win10+ 自带 WebView2，
      # 双击即跑的 portable），不做 NSIS/MSI 安装包
      # （bundle.active=true 只服务 release-macos 的 dmg 打包，此处 --no-bundle 覆盖）
      - name: Build portable exe
        shell: bash
        run: pnpm exec tauri build --no-bundle

      - name: Rename asset (AiBOX-vX.Y.Z-windows-x64.exe)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DST="AiBOX-v${VERSION}-windows-x64.exe"
          SRC="target/release/AiBOX.exe"
          if [ ! -f "$SRC" ]; then
            SRC="$(find . -path ./node_modules -prune -o -name 'AiBOX.exe' -print | head -n 1)"
          fi
          if [ ! -f "$SRC" ]; then
            echo "::error::AiBOX.exe not found under target/release"
            find target -maxdepth 3 -type f -name '*.exe' || true
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "ASSET_NAME=$DST" >> "$GITHUB_ENV"
          ls -la "$DST"

      - name: Stage Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 3

  # ── Stage the macOS Universal dmg (ad-hoc signed). ──
  release-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    env:
      # 无 Apple 开发者证书 → ad-hoc 签名（Tauri 默认）；显式声明避免身份探测挂起
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Inject version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.mjs "$VERSION"

      # 目录快照：发布二进制内嵌最新 registry index（失败沿用仓库内快照，不阻断）
      - name: Refresh registry catalog snapshot
        run: node scripts/gen-registry-snapshot.mjs

      - name: Test configuration writes on macOS
        run: cargo test --locked -p aibox-core --lib config

      # Tauri v2 官方 Universal 方式：一次构建 lipo 合并 arm64+x86_64
      - name: Build universal dmg
        run: pnpm exec tauri build --target universal-apple-darwin --bundles dmg

      - name: Rename asset (AiBOX-vX.Y.Z-macos-universal.dmg)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DST="AiBOX-v${VERSION}-macos-universal.dmg"
          SRC="$(find target -path '*bundle/dmg/*.dmg' | head -n 1)"
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::dmg not found under target/**/bundle/dmg"
            find target -maxdepth 6 -type f -name '*.dmg' || true
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "ASSET_NAME=$DST" >> "$GITHUB_ENV"
          ls -la "$DST"

      - name: Stage macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 3

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-linux, tauri-check, tauri-check-windows, sanitization, release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Stage and verify both assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          win="AiBOX-$tag-windows-x64.exe"
          mac="AiBOX-$tag-macos-universal.dmg"
          test -s "$win"
          test -s "$mac"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          repo="$GITHUB_REPOSITORY"
          # Resume failed uploads only when the matching release is still a draft.
          release_api="repos/$repo/releases?per_page=50"
          gh api --paginate --slurp "$release_api" > /tmp/aibox-releases.json
          state=$(jq -er --arg tag "$tag" '
            [ .[][] | select(.tag_name == $tag) ] |
            if length == 0 then "missing"
            elif length == 1 and .[0].draft then "draft"
            else error("expected at most one unpublished release for this tag") end
          ' /tmp/aibox-releases.json)
          if [[ "$state" == missing ]]; then
            gh release create "$tag" --repo "$repo" --verify-tag --draft --generate-notes
          fi
          gh release upload "$tag" "$win" "$mac" --repo "$repo" --clobber
          gh api --paginate --slurp "$release_api" > /tmp/aibox-releases.json
          python3 - "$win" "$mac" <<'PY'
          import hashlib, json, os, pathlib, sys
          pages = json.loads(pathlib.Path('/tmp/aibox-releases.json').read_text())
          draft, = [r for page in pages for r in page if r['tag_name'] == os.environ['GITHUB_REF_NAME']]
          assert draft['draft']
          assert sorted(asset['name'] for asset in draft['assets']) == sorted(sys.argv[1:])
          for asset in draft['assets']:
              path = pathlib.Path(asset['name'])
              assert path.stat().st_size == asset['size']
              assert asset.get('digest') == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$tag" --repo "$repo" --draft=false --latest


  # ── 脱敏复检：全历史 + 工作树内部引用/凭据扫描（scripts/prepush-scan.mjs）──
  sanitization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for internal references
        run: node scripts/prepush-scan.mjs --history
